<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Simon Says - watch the colors light up, then repeat the pattern.">
  <meta name="theme-color" content="#fff1d6">
  <title>Simon Says | Toy Box Arcade</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('toybox_theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        var s = localStorage.getItem('toybox_shell');
        if (s) document.documentElement.dataset.shell = s;
      } catch (e) { }
    })();
  </script>
  <link rel="stylesheet" href="../../toybox.css">
  <link rel="stylesheet" href="../../games.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <a class="skip-link" href="#pads">Skip to game</a>

  <header class="topbar">
    <a class="toy-btn toy-btn--ghost" href="../../index.html"><svg width="20" height="20" aria-hidden="true"><use href="../../assets/icons.svg#i-back"></use></svg>Games</a>
    <h1 class="page-title">Simon Says</h1>
    <div class="topbar-actions">
      <button type="button" class="toy-btn toy-btn--ghost icon-btn hud-audio-toggle" aria-label="Sound" aria-pressed="true" title="Sound on / off">
        <svg aria-hidden="true"><use href="../../assets/icons.svg#i-sound"></use></svg>
      </button>
      <button type="button" class="theme-switch" data-theme-toggle role="switch" aria-checked="false" aria-label="Dark mode" title="Light / dark mode">
        <svg class="ts-icon ts-sun" aria-hidden="true"><use href="../../assets/icons.svg#i-sun"></use></svg>
        <svg class="ts-icon ts-moon" aria-hidden="true"><use href="../../assets/icons.svg#i-moon"></use></svg>
        <span class="ts-knob"></span>
      </button>
    </div>
  </header>

  <main>
    <section class="game-console" style="--gc-w: 560px" aria-label="Simon Says game">
      <div class="console-head">
        <span class="plate"><span class="led" aria-hidden="true"></span>Simon Says</span>
        <span class="stats"><span class="chip" id="memory-best-badge">Best: level 0</span></span>
      </div>

      <div class="bezel">
        <div class="screen memory-screen">
          <h2 id="level-title" aria-live="polite">Pick a speed to start</h2>

          <div id="difficulty-selector" class="seg" role="group" aria-label="Speed">
            <button type="button" id="easy" class="toy-btn toy-btn--ghost diff-btn">Easy</button>
            <button type="button" id="medium" class="toy-btn toy-btn--ghost diff-btn">Medium</button>
            <button type="button" id="hard" class="toy-btn toy-btn--ghost diff-btn">Hard</button>
          </div>

          <div class="pads" id="pads">
            <button type="button" id="green" class="pad pad--green" aria-label="Green pad"></button>
            <button type="button" id="red" class="pad pad--red" aria-label="Red pad"></button>
            <button type="button" id="yellow" class="pad pad--yellow" aria-label="Yellow pad"></button>
            <button type="button" id="blue" class="pad pad--blue" aria-label="Blue pad"></button>
          </div>
        </div>
      </div>

      <p class="how-to">Watch the pads light up, then tap them in the same order.</p>
    </section>
  </main>

  <footer class="site-foot">
    <p>Copyright (c) 2026 ReLU Technologies Private Limited. All rights reserved.</p>
  </footer>

  <script src="../../toybox.js"></script>
  <script src="./game.js"></script>
</body>

</html>
