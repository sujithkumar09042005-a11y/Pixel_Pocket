<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rock Paper Scissors - beat the robot and build a winning streak.">
  <meta name="theme-color" content="#fff1d6">
  <title>Rock Paper Scissors | Toy Box Arcade</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('toybox_theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        var s = localStorage.getItem('toybox_shell');
        if (s) document.documentElement.dataset.shell = s;
      } catch (e) { }
    })();
  </script>
  <link rel="stylesheet" href="../../toybox.css">
  <link rel="stylesheet" href="../../games.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <a class="skip-link" href="#console">Skip to game</a>

  <header class="topbar">
    <a class="toy-btn toy-btn--ghost" href="../../index.html"><svg width="20" height="20" aria-hidden="true"><use href="../../assets/icons.svg#i-back"></use></svg>Games</a>
    <h1 class="page-title">Rock Paper Scissors</h1>
    <div class="topbar-actions">
      <button type="button" class="toy-btn toy-btn--ghost icon-btn hud-audio-toggle" aria-label="Sound" aria-pressed="true" title="Sound on / off">
        <svg aria-hidden="true"><use href="../../assets/icons.svg#i-sound"></use></svg>
      </button>
      <button type="button" class="theme-switch" data-theme-toggle role="switch" aria-checked="false" aria-label="Dark mode" title="Light / dark mode">
        <svg class="ts-icon ts-sun" aria-hidden="true"><use href="../../assets/icons.svg#i-sun"></use></svg>
        <svg class="ts-icon ts-moon" aria-hidden="true"><use href="../../assets/icons.svg#i-moon"></use></svg>
        <span class="ts-knob"></span>
      </button>
    </div>
  </header>

  <main>
    <section class="game-console" id="console" style="--gc-w: 700px" aria-label="Rock Paper Scissors game">
      <div class="console-head">
        <span class="plate"><span class="led" aria-hidden="true"></span>Rock Paper Scissors</span>
        <span class="stats"><span class="chip">Streak <b id="streak-num">0</b></span><span class="chip" id="best-streak-num">Best: 0</span></span>
      </div>

      <div class="bezel">
        <div class="screen rps-screen">

          <!-- Landing: choose Best of 1 / 3 / 5 -->
          <section class="landing-page" id="landing-page">
            <svg class="landing-art" aria-hidden="true"><use href="../../assets/icons.svg#a-rps"></use></svg>
            <h2>How long should we play?</h2>
            <div class="mode-options seg">
              <button type="button" class="toy-btn toy-btn--ghost mode-btn" data-rounds="1">Best of 1</button>
              <button type="button" class="toy-btn toy-btn--ghost mode-btn" data-rounds="3">Best of 3</button>
              <button type="button" class="toy-btn toy-btn--ghost mode-btn" data-rounds="5">Best of 5</button>
            </div>
          </section>

          <!-- Game screen -->
          <section class="game-screen hidden" id="game-screen">
            <p class="match-info" id="match-info"></p>

            <div class="scoreboard">
              <div class="score-block">
                <span class="score-label">You</span>
                <span id="user-score" class="score-num">0</span>
              </div>
              <span class="score-separator" aria-hidden="true">:</span>
              <div class="score-block">
                <span class="score-label">Robot</span>
                <span id="computer-score" class="score-num">0</span>
              </div>
            </div>

            <div class="battle-area">
              <div class="battle-side">
                <p class="battle-label">You</p>
                <div class="battle-choice" id="user-battle-choice">
                  <span class="placeholder-text">Ready</span>
                  <img class="choice-img hidden" id="user-choice-img" src="" alt="">
                </div>
              </div>
              <span class="battle-vs" aria-hidden="true">VS</span>
              <div class="battle-side">
                <p class="battle-label">Robot</p>
                <div class="battle-choice" id="comp-battle-choice">
                  <span class="placeholder-text" id="comp-placeholder">?</span>
                  <img class="choice-img hidden" id="comp-choice-img" src="" alt="">
                </div>
              </div>
            </div>

            <div class="result-area" aria-live="polite">
              <p id="result-message">Pick your move!</p>
              <p id="ai-taunt" class="ai-taunt"></p>
            </div>

            <div class="select-choice-section">
              <div class="choices-container" role="group" aria-label="Choose your move">
                <button type="button" class="choice" id="rock" data-choice="rock">
                  <img src="assets/rock.svg" alt="" width="72" height="72"><span class="choice-name">Rock</span>
                </button>
                <button type="button" class="choice" id="paper" data-choice="paper">
                  <img src="assets/paper.svg" alt="" width="72" height="72"><span class="choice-name">Paper</span>
                </button>
                <button type="button" class="choice" id="scissors" data-choice="scissors">
                  <img src="assets/scissors.svg" alt="" width="72" height="72"><span class="choice-name">Scissors</span>
                </button>
              </div>
            </div>

            <!-- Match over -->
            <div class="game-over-area toy-overlay hidden" id="game-over-area" role="alertdialog" aria-label="Match over">
              <div class="toy-card game-over-inner">
                <h2 id="game-over-message"></h2>
                <p>Ready for another match?</p>
                <button type="button" class="toy-btn play-again-btn" id="play-again-btn">Play again</button>
              </div>
            </div>
          </section>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-foot">
    <p>Copyright (c) 2026 ReLU Technologies Private Limited. All rights reserved.</p>
  </footer>

  <audio id="point-sfx" preload="auto">
    <source src="assets/Point_SFX.mp3" type="audio/mpeg">
  </audio>
  <audio id="gameover-sfx" preload="auto">
    <source src="assets/Game_Over_SFX.mp3" type="audio/mpeg">
  </audio>

  <script src="../../toybox.js"></script>
  <script src="script.js"></script>
</body>

</html>
