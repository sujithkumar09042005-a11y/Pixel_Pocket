<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Block Stack - spin and drop falling blocks to clear whole lines.">
    <meta name="theme-color" content="#fff1d6">
    <title>Block Stack | Toy Box Arcade</title>
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('toybox_theme');
                if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.dataset.theme = t;
                var s = localStorage.getItem('toybox_shell');
                if (s) document.documentElement.dataset.shell = s;
            } catch (e) { }
        })();
    </script>
    <link rel="stylesheet" href="../../toybox.css">
    <link rel="stylesheet" href="../../games.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="skip-link" href="#tetris">Skip to game</a>

    <header class="topbar">
        <a class="toy-btn toy-btn--ghost" href="../../index.html"><svg width="20" height="20" aria-hidden="true"><use href="../../assets/icons.svg#i-back"></use></svg>Games</a>
        <h1 class="page-title">Block Stack</h1>
        <div class="topbar-actions">
            <button type="button" class="toy-btn toy-btn--ghost icon-btn hud-audio-toggle" aria-label="Sound" aria-pressed="true" title="Sound on / off">
                <svg aria-hidden="true"><use href="../../assets/icons.svg#i-sound"></use></svg>
            </button>
            <button type="button" class="theme-switch" data-theme-toggle role="switch" aria-checked="false" aria-label="Dark mode" title="Light / dark mode">
                <svg class="ts-icon ts-sun" aria-hidden="true"><use href="../../assets/icons.svg#i-sun"></use></svg>
                <svg class="ts-icon ts-moon" aria-hidden="true"><use href="../../assets/icons.svg#i-moon"></use></svg>
                <span class="ts-knob"></span>
            </button>
        </div>
    </header>

    <main>
        <section class="game-console" style="--gc-w: 620px" aria-label="Block Stack game">
            <div class="console-head">
                <span class="plate"><span class="led" aria-hidden="true"></span>Block Stack</span>
                <span class="stats"><span class="chip" id="score">Score: 0</span></span>
            </div>

            <div class="bezel">
                <div class="screen tetris-layout">
                    <div class="game-container" id="board-wrap">
                        <canvas id="tetris" width="240" height="480" role="img"
                            aria-label="Block Stack board. Arrow keys move and rotate, space drops."></canvas>
                        <div id="pause-overlay" class="toy-overlay" style="display: none;">
                            <div class="overlay-title">Paused</div>
                            <div class="overlay-sub">Press P or tap to keep playing</div>
                        </div>
                    </div>

                    <aside class="tetris-sidebar">
                        <div class="sidebar-box">
                            <span class="sidebar-title">Next</span>
                            <div class="next-canvas-wrapper">
                                <canvas id="next-canvas" width="96" height="96" aria-hidden="true"></canvas>
                            </div>
                        </div>
                        <div class="sidebar-box">
                            <span class="sidebar-title">Best</span>
                            <span id="best-score" class="sidebar-val">0</span>
                        </div>
                        <button type="button" id="pause-btn" class="toy-btn" title="Pause (P)">Pause</button>
                    </aside>
                </div>
            </div>

            <div class="touch-pad tetris-mobile-controls" id="tetris-mobile-controls" aria-label="Touch controls">
                <button type="button" class="round-btn" id="ctrl-left" aria-label="Left">&#9664;</button>
                <button type="button" class="round-btn" id="ctrl-rotate" aria-label="Rotate">&#8635;</button>
                <button type="button" class="round-btn" id="ctrl-right" aria-label="Right">&#9654;</button>
                <button type="button" class="round-btn" id="ctrl-soft" aria-label="Soft drop">&#9660;</button>
                <button type="button" class="round-btn" id="ctrl-hard" aria-label="Hard drop">&#10515;</button>
            </div>

            <p class="how-to">Left / right to move, up to spin, down to speed up, space to drop, P to pause.</p>
        </section>
    </main>

    <footer class="site-foot">
        <p>Copyright (c) 2026 ReLU Technologies Private Limited. All rights reserved.</p>
    </footer>

    <script src="../../toybox.js"></script>
    <script src="./script.js"></script>
</body>

</html>
